<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    >
    <title>Apertus Workbench</title>
    <link rel="stylesheet" href="shell.css">
  </head>
  <body data-phase="starting">
    <main>
      <div class="mark" aria-hidden="true">
        <span class="mark-center"></span>
        <span class="mark-node node-a"></span>
        <span class="mark-node node-b"></span>
        <span class="mark-node node-c"></span>
        <span class="mark-node node-d"></span>
      </div>
      <p class="eyebrow">Lokální výzkumný workbench</p>
      <h1>Apertus</h1>
      <section class="status" aria-live="polite">
        <span id="status-dot" class="status-dot" aria-label="starting"></span>
        <div>
          <h2 id="status-title">Spouštím Apertus</h2>
          <p id="status-message">Kontroluji lokální prostředí.</p>
          <ul id="status-details"></ul>
        </div>
      </section>
      <div class="actions">
        <button id="choose-root" type="button" hidden>Vybrat repozitář workbenche</button>
        <button id="retry" class="secondary" type="button" hidden>Zkusit znovu</button>
        <button id="open-log" class="text-button" type="button" hidden>Otevřít diagnostický log</button>
      </div>
      <p class="privacy">Model, vstupy i archiv zůstávají v tomto počítači.</p>
    </main>
    <script type="module" src="renderer.mjs"></script>
  </body>
</html>
