name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python tools/audit_release.py
      - run: python -m build
      - run: python tools/verify_wheel.py dist/apertus_workbench-0.1.0a1-py3-none-any.whl
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apertus/garden/e2e/package-lock.json
      - run: npm ci
        working-directory: apertus/garden/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: apertus/garden/e2e
      - run: npm run test:stub
        working-directory: apertus/garden/e2e
      - run: npm run test:admin
        working-directory: apertus/garden/e2e
      - run: node --test apertus/garden/desktop/tests/*.test.mjs
